[package]
name = "folio"
version = "0.7.0"
edition = "2024"
description = "A small, Omarchy-native PDF reader and editor"
license = "MIT"

[dependencies]
anyhow = "1.0"
dirs = "6.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tempfile = "3.23"

[profile.release]
lto = "thin"
strip = true
