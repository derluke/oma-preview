[package]
name = "oma-preview"
version = "0.9.0"
edition = "2024"
description = "A small, Omarchy-native PDF reader and editor"
license = "MIT"

[dependencies]
anyhow = "1.0"
dirs = "6.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tempfile = "3.23"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[profile.release]
lto = "thin"
strip = true
