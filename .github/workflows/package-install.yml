name: Released package install
on:
  workflow_dispatch:
    inputs:
      version:
        description: Published release version (without v)
        required: true
        default: '0.9.0'
permissions:
  contents: read
jobs:
  install:
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - run: pacman -Syu --noconfirm git curl python imagemagick
      - uses: actions/checkout@v4
        with:
          # Test the selected release's contract, not unreleased main-branch APIs.
          ref: v${{ inputs.version }}
      - name: Install the published package and dependencies
        env:
          VERSION: ${{ inputs.version }}
        run: |
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          # The minimal Arch image excludes documentation. Install every file
          # so the package integrity check matches a normal desktop install.
          sed -i '/^NoExtract/d' /etc/pacman.conf
          curl --fail --location --output /tmp/oma-preview.pkg.tar.zst "https://github.com/derluke/oma-preview/releases/download/v$VERSION/oma-preview-$VERSION-1-x86_64.pkg.tar.zst"
          pacman -U --noconfirm /tmp/oma-preview.pkg.tar.zst
          pacman -Qkk oma-preview
          test "$(oma-preview --version)" = "oma-preview $VERSION"
      - name: Exercise installed UI and backend
        env:
          OMA_PREVIEW_TEST_UI: /usr/share/oma-preview/ui
          OMA_PREVIEW_TEST_BIN: /usr/bin/oma-preview
          QT_QPA_PLATFORMTHEME: ''
        run: |
          mkdir -p output
          if [[ -f tests/offscreen-suite.py ]]; then
            python tests/offscreen-suite.py
          else
            python tests/dialog-smoke.py
            python tests/history-render.py
          fi
