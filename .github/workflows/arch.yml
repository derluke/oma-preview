name: Arch Linux
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - name: Install build and runtime dependencies
        run: pacman -Syu --noconfirm git rust quickshell qt6-webengine qpdf poppler librsvg desktop-file-utils python
      - uses: actions/checkout@v4
      - name: Build and test
        run: |
          cargo test --locked
          python -m unittest discover -s tests -p 'test_*.py'
          python tests/dialog-smoke.py
          python tests/history-render.py
          cargo build --release --locked
          desktop-file-validate data/org.omarchy.oma-preview.desktop
          target/release/oma-preview --version
      - uses: actions/upload-artifact@v4
        with:
          name: oma-preview-linux-x86_64
          path: target/release/oma-preview
